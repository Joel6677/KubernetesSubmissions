apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes: # Define volume
        - name: shared-image
          persistentVolumeClaim:
            claimName: image-claim
        - name: config-volume
          configMap:
            name: log-output-configmap
            items:
              - key: information.txt
                path: information.txt
      containers:
          - name: generator
            image: joelheusala/log-output-generator:3.2
            imagePullPolicy: Always
            volumeMounts:
              - name: shared-image
                mountPath: /shared
          - name: reader
            image: joelheusala/log-output-reader:3.2
            imagePullPolicy: Always
            env:
              - name: PORT
                value: "8080"
              - name: PINGPONG_URL
                value: "http://ping-pong-svc:2345/pings"
              - name: MESSAGE
                valueFrom:
                  configMapKeyRef:
                    name: log-output-configmap
                    key: MESSAGE
            volumeMounts:
              - name: shared-image
                mountPath: /shared
              - name: config-volume
                mountPath: /config
     
