apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cpu-check
  namespace: exercises
spec:
  metrics:
  - name: cpu-check
    initialDelay: 30s
    interval: 30s
    count: 4
    successCondition: result < 0.1
    provider:
      prometheus:
        address: http://prom-prometheus-server.monitoring.svc.cluster.local
        query: |
          scalar(sum(rate(container_cpu_usage_seconds_total{namespace="exercises"}[5m])))
