name: Release application

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: my-repository

jobs:
  staging:
    name: Build, Publish and Update Staging
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - run: gcloud --quiet auth configure-docker $REGISTRY

      - name: Form image tags
        run: |
          echo "TODO_APP_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$GITHUB_SHA" >> $GITHUB_ENV
          echo "TODO_BACKEND_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$GITHUB_SHA" >> $GITHUB_ENV
          echo "WIKIPEDIA_READER_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/wikipedia-reader:$GITHUB_SHA" >> $GITHUB_ENV
          echo "BROADCASTER_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/broadcaster:$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build and publish todo-app
        run: |
          docker build --tag "$TODO_APP_IMAGE" ./todo-app
          docker push "$TODO_APP_IMAGE"

      - name: Build and publish todo-backend
        run: |
          docker build --tag "$TODO_BACKEND_IMAGE" ./todo-backend
          docker push "$TODO_BACKEND_IMAGE"

      - name: Build and publish wikipedia-reader
        run: |
          docker build --tag "$WIKIPEDIA_READER_IMAGE" ./wikipedia-reader
          docker push "$WIKIPEDIA_READER_IMAGE"

      - name: Build and publish broadcaster
        run: |
          docker build --tag "$BROADCASTER_IMAGE" ./broadcaster
          docker push "$BROADCASTER_IMAGE"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image tags in staging overlay
        working-directory: project/overlays/staging
        run: |
          kustomize edit set image joelheusala/todo-app=$TODO_APP_IMAGE
          kustomize edit set image joelheusala/todo-backend=$TODO_BACKEND_IMAGE
          kustomize edit set image joelheusala/wikipedia-reader=$WIKIPEDIA_READER_IMAGE
          kustomize edit set image joelheusala/broadcaster=$BROADCASTER_IMAGE

      - name: Commit updated staging kustomization
        uses: EndBug/add-and-commit@v10
        with:
          add: 'project/overlays/staging/kustomization.yaml'
          message: "Update staging image tags to ${{ github.sha }}"

  production:
    name: Build, Publish and Update Production
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - run: gcloud --quiet auth configure-docker $REGISTRY

      - name: Form image tags
        run: |
          echo "TODO_APP_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$GITHUB_REF_NAME" >> $GITHUB_ENV
          echo "TODO_BACKEND_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$GITHUB_REF_NAME" >> $GITHUB_ENV
          echo "WIKIPEDIA_READER_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/wikipedia-reader:$GITHUB_REF_NAME" >> $GITHUB_ENV
          echo "BROADCASTER_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/broadcaster:$GITHUB_REF_NAME" >> $GITHUB_ENV

      - name: Build and publish todo-app
        run: |
          docker build --tag "$TODO_APP_IMAGE" ./todo-app
          docker push "$TODO_APP_IMAGE"

      - name: Build and publish todo-backend
        run: |
          docker build --tag "$TODO_BACKEND_IMAGE" ./todo-backend
          docker push "$TODO_BACKEND_IMAGE"

      - name: Build and publish wikipedia-reader
        run: |
          docker build --tag "$WIKIPEDIA_READER_IMAGE" ./wikipedia-reader
          docker push "$WIKIPEDIA_READER_IMAGE"

      - name: Build and publish broadcaster
        run: |
          docker build --tag "$BROADCASTER_IMAGE" ./broadcaster
          docker push "$BROADCASTER_IMAGE"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image tags in production overlay
        working-directory: project/overlays/production
        run: |
          kustomize edit set image joelheusala/todo-app=$TODO_APP_IMAGE
          kustomize edit set image joelheusala/todo-backend=$TODO_BACKEND_IMAGE
          kustomize edit set image joelheusala/wikipedia-reader=$WIKIPEDIA_READER_IMAGE
          kustomize edit set image joelheusala/broadcaster=$BROADCASTER_IMAGE

      - name: Commit updated production kustomization
        uses: EndBug/add-and-commit@v10
        with:
          add: 'project/overlays/production/kustomization.yaml'
          message: "Production release ${{ github.ref_name }}"

