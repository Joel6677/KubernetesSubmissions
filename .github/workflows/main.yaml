name: Release application

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

permissions:
  contents: write

jobs:
  staging:
    name: Build, Publish and Update Staging
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app code
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: Joel6677/KubernetesSubmissions-project-config
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: config-repo
        

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push todo-app
        run: |
          docker build --tag "joelheusala/todo-app:$GITHUB_SHA" ./todo-app
          docker push "joelheusala/todo-app:$GITHUB_SHA"

      - name: Build and push todo-backend
        run: |
          docker build --tag "joelheusala/todo-backend:$GITHUB_SHA" ./todo-backend
          docker push "joelheusala/todo-backend:$GITHUB_SHA"

      - name: Build and push wikipedia-reader
        run: |
          docker build --tag "joelheusala/wikipedia-reader:$GITHUB_SHA" ./wikipedia-reader
          docker push "joelheusala/wikipedia-reader:$GITHUB_SHA"

      - name: Build and push broadcaster
        run: |
          docker build --tag "joelheusala/broadcaster:$GITHUB_SHA" ./broadcaster
          docker push "joelheusala/broadcaster:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update staging image tags
        working-directory: project/overlays/staging
        run: |
          kustomize edit set image joelheusala/todo-app=joelheusala/todo-app:$GITHUB_SHA
          kustomize edit set image joelheusala/todo-backend=joelheusala/todo-backend:$GITHUB_SHA
          kustomize edit set image joelheusala/wikipedia-reader=joelheusala/wikipedia-reader:$GITHUB_SHA
          kustomize edit set image joelheusala/broadcaster=joelheusala/broadcaster:$GITHUB_SHA

      - name: Commit staging kustomization
        uses: EndBug/add-and-commit@v10
        with:
          cwd: config-repo
          add: 'project/overlays/staging/kustomization.yaml'
          message: "Update staging image tags to ${{ github.sha }}"
          push: true

  production:
    name: Build, Publish and Update Production
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: <you>/KubernetesSubmissions-config
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: config-repo

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push todo-app
        run: |
          docker build --tag "joelheusala/todo-app:$GITHUB_REF_NAME" ./todo-app
          docker push "joelheusala/todo-app:$GITHUB_REF_NAME"

      - name: Build and push todo-backend
        run: |
          docker build --tag "joelheusala/todo-backend:$GITHUB_REF_NAME" ./todo-backend
          docker push "joelheusala/todo-backend:$GITHUB_REF_NAME"

      - name: Build and push wikipedia-reader
        run: |
          docker build --tag "joelheusala/wikipedia-reader:$GITHUB_REF_NAME" ./wikipedia-reader
          docker push "joelheusala/wikipedia-reader:$GITHUB_REF_NAME"

      - name: Build and push broadcaster
        run: |
          docker build --tag "joelheusala/broadcaster:$GITHUB_REF_NAME" ./broadcaster
          docker push "joelheusala/broadcaster:$GITHUB_REF_NAME"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update production image tags
        working-directory: project/overlays/production
        run: |
          kustomize edit set image joelheusala/todo-app=joelheusala/todo-app:$GITHUB_REF_NAME
          kustomize edit set image joelheusala/todo-backend=joelheusala/todo-backend:$GITHUB_REF_NAME
          kustomize edit set image joelheusala/wikipedia-reader=joelheusala/wikipedia-reader:$GITHUB_REF_NAME
          kustomize edit set image joelheusala/broadcaster=joelheusala/broadcaster:$GITHUB_REF_NAME

      - name: Commit production kustomization
        uses: EndBug/add-and-commit@v10
        with:
          cwd: config-repo
          add: 'project/overlays/production/kustomization.yaml'
          message: "Production release ${{ github.ref_name }}"
          push: true
