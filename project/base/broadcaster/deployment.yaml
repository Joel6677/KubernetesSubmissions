apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
spec:
  replicas: 6
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: joelheusala/broadcaster:4.6
          env:
            - name: NATS_URL
              value: "nats://my-nats.nats.svc.cluster.local:4222"
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: broadcaster-webhook
                  key: WEBHOOK_URL
