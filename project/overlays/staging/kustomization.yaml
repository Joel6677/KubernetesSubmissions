apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base
  - gateway.yaml
  - namespace.yaml

patches:
  - target:
      kind: CronJob
      name: todo-backend-backup
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: todo-backend-backup
      $patch: delete
