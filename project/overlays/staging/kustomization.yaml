apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base
  - gateway.yaml
  - namespace.yaml

patches:
  - target:
      kind: CronJob
      name: todo-backend-backup
    patch: |-
      $patch: delete
  - target:
      kind: Deployment
      name: broadcaster
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_ONLY
          value: "true"
